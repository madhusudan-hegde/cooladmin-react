name: Release

# Continuous delivery for `main`: run the checks, then let semantic-release
# derive the version from Conventional Commits and publish. Contributors only
# need to write conventional commit messages — see README "Releasing".

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check (library)
        run: pnpm type-check
      - name: Lint (library)
        run: pnpm lint
      - name: Test (library)
        run: pnpm test
      - name: Build (library)
        run: pnpm build
      - name: Verify dist boundaries
        run: |
          SRC_COUNT=$(grep -rl "^'use client'" src --include='*.ts' --include='*.tsx' | grep -v '.test.' | wc -l)
          DIST_COUNT=$(grep -rl '^"use client"' dist --include='*.js' | wc -l)
          echo "src client modules: $SRC_COUNT, dist client modules: $DIST_COUNT"
          test "$SRC_COUNT" -eq "$DIST_COUNT"
          ! head -1 dist/form/m-button.js | grep -q 'use client'
          test -s dist/css/cooladmin.css
          # Core must stay framework-agnostic: only dist/adapters/* may import a router
          ! grep -rlE "from ['\"](next|react-router)" dist --include='*.js' | grep -v '^dist/adapters/' | grep .
          test -f dist/adapters/next.js && test -f dist/adapters/react-router.js
      - name: Type-check (demo)
        run: pnpm --filter cooladmin-react-demo type-check
      - name: Build (demo)
        run: pnpm demo:build
      - name: Type-check + build (Vite example)
        run: |
          pnpm --filter cooladmin-react-example-vite-react-router type-check
          pnpm --filter cooladmin-react-example-vite-react-router build

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Build (library)
        run: pnpm build
      - name: semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

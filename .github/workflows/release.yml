name: Release

# Every push to `main` is a release candidate. semantic-release reads the
# Conventional Commits since the last `v*` tag, decides the semver bump
# (fix → patch, feat → minor, "feat!:" / "BREAKING CHANGE:" → major; docs /
# chore / test / ci → no release), writes the version into package.json,
# publishes @madhusudan-hegde/cooladmin-react to npm, tags the commit, creates
# a GitHub Release with the generated notes, and pushes the version bump back
# as "chore(release): vX.Y.Z [skip ci]".
#
# Requirements: an npm Automation token in the NPM_TOKEN repository secret.
# GITHUB_TOKEN is provided by Actions (needs `contents: write` for the tag,
# release and version-bump commit). `id-token: write` enables npm provenance.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check (library)
        run: pnpm type-check
      - name: Lint (library)
        run: pnpm lint
      - name: Test (library)
        run: pnpm test
      - name: Build (library)
        run: pnpm build
      - name: Verify dist boundaries
        run: |
          SRC_COUNT=$(grep -rl "^'use client'" src --include='*.ts' --include='*.tsx' | grep -v '.test.' | wc -l)
          DIST_COUNT=$(grep -rl '^"use client"' dist --include='*.js' | wc -l)
          echo "src client modules: $SRC_COUNT, dist client modules: $DIST_COUNT"
          test "$SRC_COUNT" -eq "$DIST_COUNT"
          ! head -1 dist/form/m-button.js | grep -q 'use client'
          test -s dist/css/cooladmin.css
          # Core must stay framework-agnostic: only dist/adapters/* may import a router
          ! grep -rlE "from ['\"](next|react-router)" dist --include='*.js' | grep -v '^dist/adapters/' | grep .
          test -f dist/adapters/next.js && test -f dist/adapters/react-router.js
      - name: Type-check (demo)
        run: pnpm --filter cooladmin-react-demo type-check
      - name: Build (demo)
        run: pnpm demo:build
      - name: Type-check + build (Vite example)
        run: |
          pnpm --filter cooladmin-react-example-vite-react-router type-check
          pnpm --filter cooladmin-react-example-vite-react-router build

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    # The version-bump commit carries [skip ci]; this is a belt-and-braces guard.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build (library)
        run: pnpm build
      - name: semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

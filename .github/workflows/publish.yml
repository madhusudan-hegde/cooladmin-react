name: Publish to npm

# Publishes @madhusudan-hegde/cooladmin-react when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in package.json. Requires an npm Automation
# token stored as the NPM_TOKEN repository secret (Settings → Secrets → Actions).
# `id-token: write` lets npm attach provenance (the "built from this commit" badge).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # prepublishOnly runs type-check, lint, tests and the build.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

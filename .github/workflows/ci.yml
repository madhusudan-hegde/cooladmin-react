name: CI

# Pull requests and feature branches. Pushes to `main` run release.yml
# instead, which repeats these checks and then publishes via semantic-release.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (library)
        run: pnpm type-check

      - name: Lint (library)
        run: pnpm lint

      - name: Test (library)
        run: pnpm test

      - name: Build (library)
        run: pnpm build

      - name: Verify dist RSC boundaries
        run: |
          # Every 'use client' module in src must have a matching directive in dist,
          # and RSC-authored modules must NOT be marked client.
          SRC_COUNT=$(grep -rl "^'use client'" src --include='*.ts' --include='*.tsx' | grep -v '.test.' | wc -l)
          DIST_COUNT=$(grep -rl '^"use client"' dist --include='*.js' | wc -l)
          echo "src client modules: $SRC_COUNT, dist client modules: $DIST_COUNT"
          test "$SRC_COUNT" -eq "$DIST_COUNT"
          # Spot-check: a pure-presentational component must stay a server component
          ! head -1 dist/form/m-button.js | grep -q 'use client'
          # The compiled stylesheet must ship with the package
          test -s dist/css/cooladmin.css
          # The core must stay framework-agnostic: only dist/adapters/* may import a router
          ! grep -rlE "from ['\"](next|react-router)" dist --include='*.js' | grep -v '^dist/adapters/' | grep .
          test -f dist/adapters/next.js && test -f dist/adapters/react-router.js

      - name: Type-check (demo)
        run: pnpm --filter cooladmin-react-demo type-check

      - name: Build (demo)
        run: pnpm demo:build
